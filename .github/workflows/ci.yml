name: CI

on:
  # Branches get CI through their PR (open a draft PR, or start a run by hand),
  # so a push to a branch with an open PR runs once, not twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR's new push cancels its stale run. Every other run gets its own group, so
# no run on main is cancelled, not even by a manual run of the same commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts requires this to resolve, but nothing here connects to a database.
      DIRECT_URL: postgresql://ci@localhost/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Build first: it compiles engine (which api imports from dist) and catches
      # anything that would break the Heroku build.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
