@if (user(); as user) {
  <header>
    <a class="logo" routerLink="/">
      <img src="logo.svg" alt="Swantisserie home" width="40" height="40" />
    </a>
    <img class="avatar" [src]="user.avatarUrl" alt="" width="32" height="32" />
    <span class="name">{{ user.name }}</span>
    @if (user.isAdmin) {
      <div class="extra-controls">
        <a class="button quiet" routerLink="/admin/webhooks">Webhooks</a>
      </div>
    }
    <button class="button quiet" type="button" (click)="logout()">Log out</button>
  </header>
}
@if (pageStatus() === 'Loading') {
  <app-loading-animation size="page">Loading…</app-loading-animation>
} @else if (pageStatus() === 'Failed') {
  <p class="page-status error" role="alert">
    Couldn't load this page. Check your connection and try reloading.
  </p>
}
<router-outlet />
