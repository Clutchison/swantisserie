@if (user(); as user) {
  <header>
    <img class="avatar" [src]="user.avatarUrl" alt="" width="32" height="32" />
    <span class="name">{{ user.name }}</span>
    @if (user.isAdmin) {
      <a routerLink="/admin/webhooks">Webhooks</a>
    }
    <button type="button" (click)="logout()">Log out</button>
  </header>
}
@if (pageStatus() === 'Loading') {
  <p class="page-status">Loading…</p>
} @else if (pageStatus() === 'Failed') {
  <p class="page-status error" role="alert">
    Couldn't load this page. Check your connection and try reloading.
  </p>
}
<router-outlet />
