<main>
  <h1>Swantisserie</h1>
  @if (loading()) {
    <p>Checking…</p>
  } @else if (status(); as health) {
    <ul>
      <li [class.ok]="health.api === 'ok'">API {{ health.api }}</li>
      <li [class.ok]="health.db === 'ok'">DB {{ health.db }}</li>
    </ul>
  } @else {
    <ul>
      <li>API unreachable</li>
    </ul>
  }
</main>
