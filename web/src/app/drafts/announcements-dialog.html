<div class="dialog">
  <h3 [id]="headingId">Announcements</h3>
  <div class="dialog-body">
    <label>
      Webhook
      <select name="draftWebhook" [formControl]="choice" (change)="save()">
        @for (webhook of webhooks(); track webhook.id) {
          <option [ngValue]="webhook.id" [disabled]="webhook.gone">
            {{ webhook.name }}{{ webhook.gone ? ' (gone)' : '' }}
          </option>
        }
        <option [ngValue]="null">None</option>
      </select>
    </label>
    @if (webhooksFailed()) {
      <p class="error" role="alert">Couldn't load the webhooks. Try reloading the page.</p>
    }
    @if (saveError(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }
  </div>
  <div class="dialog-actions">
    <button class="button" type="button" (click)="close()">Close</button>
  </div>
</div>
