<div class="dialog">
  <h3 [id]="headingId">Queue unpicked cards</h3>
  <div class="dialog-body">
    @if (queueCount() === 0) {
      <p>
        {{
          includeSideboard()
            ? 'Nothing in your deck to queue.'
            : 'Nothing on your mainboard to queue.'
        }}
      </p>
    } @else {
      <p>Adds {{ queueCountText() }} to the end of your queue.</p>
    }
    <label>
      <input
        type="checkbox"
        [checked]="includeSideboard()"
        (change)="includeSideboard.set($any($event.target).checked)"
      />
      Include sideboard
    </label>
  </div>
  <div class="dialog-actions">
    <button class="button secondary" type="button" cdkFocusInitial (click)="close()">Cancel</button>
    <button
      class="button"
      type="button"
      (click)="queueUnpicked()"
      [disabled]="sending() || queueCount() === 0"
    >
      Queue {{ queueCountText() }}
    </button>
  </div>
</div>
