<details class="how-this-works">
  <summary>How this works</summary>
  <p class="detail">Each joined player’s deck as it was locked when the tournament started.</p>
</details>
@if (missing()) {
  <p class="error">Couldn't load the decklists. Try reloading the page.</p>
} @else if (loading()) {
  <app-loading-animation size="tab">Loading the decklists…</app-loading-animation>
} @else {
  @for (decklist of decklists(); track decklist.playerId) {
    <app-decklist [decklist]="decklist" [playerName]="playerName(decklist)" [cards]="cards()" />
  }
}
