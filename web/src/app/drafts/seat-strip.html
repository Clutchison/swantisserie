<section aria-label="Seats">
  <button
    #toggle
    class="players-button"
    type="button"
    aria-label="Players"
    title="Players"
    aria-haspopup="dialog"
    [attr.aria-controls]="panelIn() === 'popover' ? 'players-popover' : null"
    [attr.aria-expanded]="panelOpen()"
    (click)="togglePanel()"
  >
    <svg lucideUsers size="20"></svg>
  </button>
  <!-- Scrolls sideways on its own if the seats outgrow the strip, fading where it clips them. -->
  <!-- role="list" keeps its list semantics in Safari, which drops them with the list style. -->
  <ol #seatList role="list" [attr.aria-label]="seatListName()" (scroll)="hint.follow()">
    @for (player of players(); track player.id; let first = $first) {
      <li>
        <!-- Between each pair of seats, toward the next player to pick; the list's name says who that is. -->
        @if (!first && arrow(); as icon) {
          <svg class="arrow" aria-hidden="true" [lucideIcon]="icon" [size]="arrowSize"></svg>
        }
        <app-seat
          #seat
          [player]="player"
          [own]="isOwn(player)"
          [extraNameParts]="hasTheTurn(player) ? ['picking'] : []"
          [class.turn]="hasTheTurn(player)"
          [class.pulse]="hasTheTurn(player) && pulse() === 'pulse'"
          [class.pulse-again]="hasTheTurn(player) && pulse() === 'pulse-again'"
          [class.pulse-loop]="hasTheTurn(player) && ownLoop.looping()"
          [attr.data-pulse]="hasTheTurn(player) ? turnPulse() : null"
          [attr.aria-current]="hasTheTurn(player) ? 'true' : null"
          (nameHint)="hint.show(player, $event)"
          (animationend)="pulse.set(null)"
          (animationiteration)="ownLoop.beatEnded()"
        />
      </li>
    }
  </ol>
</section>
<!-- Outside the seats' scroller, so it isn't clipped; the seat's name is its accessible name already. -->
@if (hint.shown(); as shown) {
  <app-seat-hint [name]="shown.name" [seatBox]="shown.seatBox" />
}
@if (popoverOpen()) {
  <div
    #popover
    id="players-popover"
    class="popover"
    role="dialog"
    aria-label="Players"
    tabindex="-1"
  >
    <ng-container *ngTemplateOutlet="playersPanel()" />
  </div>
}
