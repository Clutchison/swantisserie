@if (ready()) {
  <button
    class="button compact secondary copy"
    [class.copied]="copied()"
    type="button"
    [cdkMenuTriggerFor]="copyMenu"
  >
    <!-- Stays when hidden, so the button keeps its width. -->
    <span class="label" [attr.aria-hidden]="copied() ? 'true' : null"
      >Copy <svg lucideChevronDown size="16" aria-hidden="true"></svg
    ></span>
    @if (copied()) {
      <span class="confirmation">
        <svg lucideCheck size="16" aria-hidden="true"></svg>
        Copied
      </span>
    }
  </button>
}
<!-- One item per export the draft's platform offers. -->
<ng-template #copyMenu>
  <div cdkMenu aria-label="Copy">
    @for (target of exportTargets(); track target) {
      <button type="button" cdkMenuItem (cdkMenuItemTriggered)="copyFor(target)">
        {{ target }}
      </button>
    }
  </div>
</ng-template>
<!-- Always here, as a status region only announces changes once it's on the page. -->
<p class="visually-hidden" role="status">
  @if (copied(); as target) {
    Copied for {{ target }}
  }
</p>
@if (copyFailed()) {
  <p class="error" role="alert">Couldn't copy to the clipboard. Try again in a moment.</p>
}
