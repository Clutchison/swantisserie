<div class="dialog">
  <app-change-status />
  <h3 [id]="headingId">Basic lands</h3>
  <ul>
    @for (basic of basics(); track basic.land) {
      <li>
        <!-- The symbol says nothing to assistive technology: the land's name follows it. -->
        <img [src]="basic.symbol" alt="" width="24" height="24" />
        <span class="name">{{ basic.land }}&ngsp;</span>
        <span class="count">{{ basic.count }}</span>
        <button
          class="button compact secondary"
          type="button"
          [attr.aria-label]="'Add ' + basic.land"
          [attr.title]="basic.full ? fullTitle(basic.land) : null"
          (click)="addBasic(basic.land)"
          [disabled]="basic.full"
          [appSendsChange]="'add ' + basic.land"
        >
          Add
        </button>
      </li>
    }
  </ul>
  @if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }
  <div class="dialog-actions">
    <button
      class="button secondary"
      type="button"
      (click)="clearBasics()"
      [disabled]="!hasBasics()"
      appSendsChange="clear basics"
    >
      Clear basics
    </button>
    <button class="button" type="button" cdkFocusInitial appFocusKey="done" (click)="close()">
      Done
    </button>
  </div>
</div>
