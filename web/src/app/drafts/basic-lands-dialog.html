<div class="dialog">
  <app-change-status />
  <h3 [id]="headingId">Basic lands</h3>
  <div class="rows">
    @for (basic of basics(); track basic.land) {
      <!-- Each row is a group named by its land, for assistive technology to read the count against. -->
      <div class="row" role="group" [attr.aria-label]="basic.land">
        <!-- The symbol says nothing to assistive technology: the row is named by its land. -->
        <img [src]="basic.symbol" alt="" width="24" height="24" />
        <span class="name" aria-hidden="true">{{ basic.land }}</span>
        <span class="count"
          >{{ basic.count }}<span class="visually-hidden">&ngsp;on your mainboard</span></span
        >
        <!-- A disabled button shows no tooltip in some browsers, so its wrapper carries it; assistive technology reads why from the hidden text. -->
        @if (basic.full) {
          <span class="visually-hidden">{{ fullTitle(basic.land) }}</span>
        }
        <span class="add" [attr.title]="basic.full ? fullTitle(basic.land) : null">
          <button
            class="button compact secondary"
            type="button"
            [attr.aria-label]="'Add ' + basic.land"
            (click)="addBasic(basic.land)"
            [disabled]="basic.full"
            [appSendsChange]="'add ' + basic.land"
          >
            Add
          </button>
        </span>
      </div>
    }
  </div>
  @if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }
  <div class="dialog-actions">
    <button
      class="button secondary"
      type="button"
      (click)="clearBasics()"
      [disabled]="!hasBasics()"
      appSendsChange="clear basics"
    >
      Clear basics
    </button>
    <button class="button" type="button" cdkFocusInitial appFocusKey="done" (click)="close()">
      Done
    </button>
  </div>
</div>
