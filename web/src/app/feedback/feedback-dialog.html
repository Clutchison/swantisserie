<div class="dialog">
  <h3 [id]="headingId">Send feedback</h3>
  @if (status() === 'Sent') {
    <div class="dialog-body">
      <p [id]="thanksId">Thanks, your feedback was sent</p>
    </div>
    <div class="dialog-actions">
      <!-- Focused on success, it carries the thanks for a screen reader to read with it. -->
      <button
        #closeButton
        class="button"
        type="button"
        [attr.aria-describedby]="thanksId"
        (click)="close()"
      >
        Close
      </button>
    </div>
  } @else {
    <!-- The form is the dialog's body; Submit, in the action row after it, submits it by its id. -->
    <form [id]="formId" class="dialog-body" (submit)="$event.preventDefault(); submit()">
      <textarea
        #field
        name="message"
        rows="6"
        [maxLength]="maxFeedbackLength"
        required
        aria-label="Your feedback"
        [value]="message()"
        (input)="message.set(field.value)"
      ></textarea>
      @if (status() === 'Failed') {
        <p class="error" role="alert">Couldn't send your feedback. Try again.</p>
      }
    </form>
    <div class="dialog-actions">
      <button class="button secondary" type="button" (click)="close()">Cancel</button>
      <button class="button" type="submit" [attr.form]="formId" [disabled]="!canSubmit()">
        Submit
      </button>
    </div>
  }
</div>
